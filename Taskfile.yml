version: '3'

includes:
  push:
    taskfile: ../../tools/taskfiles/push.yml
    optional: true

tasks:
  check:
    desc: Build and test the SDK, example, and transport integration tests.
    cmds:
      - dotnet restore SamplePermguard.sln
      - dotnet test SamplePermguard.sln --no-restore --configuration Release -m:1

  pack:
    desc: Build the NuGet and symbol packages locally.
    cmds:
      - dotnet pack Permguard/Permguard.csproj --configuration Release --output output

  notices:
    desc: Regenerate THIRD_PARTY_NOTICES.md from the resolved dependencies.
    cmds:
      - ./scripts/third-party-notices.sh

  check:notices:
    desc: Check that THIRD_PARTY_NOTICES.md matches the resolved dependencies.
    cmds:
      - ./scripts/third-party-notices.sh --check
