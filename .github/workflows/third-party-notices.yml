# A dependency change that never reaches THIRD_PARTY_NOTICES.md is a distribution whose notices are
# wrong. That is why this fails the build rather than warning, and why it runs on every push and
# pull request rather than only on a release.
#
name: third-party notices

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  notices:
    name: notices match the resolved dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore, so the resolved package graph exists to report on
        run: dotnet restore Permguard/Permguard.csproj
      - name: Install nuget-license
        run: dotnet tool install --global nuget-license
      - name: Put the dotnet tool directory on PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: The notices match what the build resolves
        run: ./scripts/third-party-notices.sh --check
